<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Yarn Dispatch Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAF9F5; --surface-3:#EFEDE6;
  --border:#E2DFD7; --border-strong:#C9C4B8;
  --text:#191F2E; --muted:#636A7E; --faint:#8A90A1;
  --accent:#2E4A7D; --accent-2:#3D63A4; --accent-soft:#E7EDF7; --accent-line:#AFC3E1;
  --brass:#8C6A24; --brass-soft:#F2EAD8; --brass-line:#D9C89C;
  --ok:#2A6E51; --ok-soft:#E1EFE9;
  --warn:#8B6212; --warn-soft:#F6EEDA;
  --crit:#A0413A; --crit-soft:#F7E6E3;
  --shadow-sm:0 1px 2px rgba(25,31,46,.06);
  --shadow:0 1px 3px rgba(25,31,46,.07), 0 12px 28px -16px rgba(25,31,46,.22);
  --radius:12px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E121B; --surface:#151A25; --surface-2:#1A2030; --surface-3:#232A3A;
    --border:#28303F; --border-strong:#3B4559;
    --text:#E9EBF1; --muted:#98A0B4; --faint:#79809A;
    --accent:#8AACE6; --accent-2:#A8C3F0; --accent-soft:#1A2740; --accent-line:#33456B;
    --brass:#D4A85E; --brass-soft:#2A2214; --brass-line:#4A3A1D;
    --ok:#6FC49B; --ok-soft:#14281F;
    --warn:#E0B45F; --warn-soft:#2A2214;
    --crit:#E5897C; --crit-soft:#2D1A18;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 1px 3px rgba(0,0,0,.45), 0 14px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0E121B; --surface:#151A25; --surface-2:#1A2030; --surface-3:#232A3A;
  --border:#28303F; --border-strong:#3B4559;
  --text:#E9EBF1; --muted:#98A0B4; --faint:#79809A;
  --accent:#8AACE6; --accent-2:#A8C3F0; --accent-soft:#1A2740; --accent-line:#33456B;
  --brass:#D4A85E; --brass-soft:#2A2214; --brass-line:#4A3A1D;
  --ok:#6FC49B; --ok-soft:#14281F;
  --warn:#E0B45F; --warn-soft:#2A2214;
  --crit:#E5897C; --crit-soft:#2D1A18;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 3px rgba(0,0,0,.45), 0 14px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.012em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--brass);font-weight:600}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.brand .mark{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.2}
.brand .rule{width:34px;height:2px;background:var(--brass);margin:9px 0 7px;border-radius:2px}
.brand .sub{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{padding:14px 11px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;background:none;border:0;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;position:relative}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-11px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
.railfoot{padding:13px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.savechip{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.savedot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.savechip[data-state="saving"] .savedot{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.savechip[data-state="error"] .savedot{background:var(--crit)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.themebtn{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted);width:100%}
.themebtn:hover{color:var(--text);border-color:var(--faint)}
.themebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:16px 28px 15px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.topbar h1{font-size:23px;line-height:1.2}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:22px 28px 64px;display:flex;flex-direction:column;gap:22px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:500;font-size:13px;cursor:pointer;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#0E121B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#0E121B}}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:6px;box-shadow:none}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--crit)}
.btn-danger:hover{background:var(--crit-soft);border-color:var(--crit)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:disabled{opacity:.4;cursor:default}

label.field{display:flex;flex-direction:column;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:13.5px;font-weight:400;letter-spacing:0;text-transform:none;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--surface-3);color:var(--muted)}
.filterbar{display:flex;gap:13px;flex-wrap:wrap;align-items:flex-end;padding:15px 17px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.filterbar label.field{min-width:150px;flex:1 1 160px}
.filterbar .grow{flex:2 1 230px}

/* combobox */
.combo{position:relative}
.combo input{padding-right:28px}
.combo .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 4px;line-height:1;font-size:15px;border-radius:4px}
.combo .clear:hover{color:var(--text);background:var(--surface-3)}
.combo-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;box-shadow:var(--shadow);max-height:264px;overflow:auto;padding:4px}
.combo-item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo-item:hover,.combo-item.on{background:var(--accent-soft);color:var(--accent)}
.combo-item mark{background:transparent;color:var(--brass);font-weight:600}
.combo-empty{padding:9px 10px;font-size:12.5px;color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.card-head{padding:15px 19px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.card-head h2{font-size:15.5px}
.card-head .hint{font-size:12px;color:var(--muted);margin-left:auto}
.card-body{padding:19px}
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:-6px}
.sechead h2{font-size:14px}
.sechead .line{flex:1;height:1px;background:var(--border)}
.sechead .note{font-size:11.5px;color:var(--faint)}

/* ---------- tiles ---------- */
.tiles{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.tiles.t4{grid-template-columns:repeat(4,1fr)}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.tiles.t4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.tiles.t4,.tiles.t3,.tiles.t2{grid-template-columns:1fr}}
.tile{background:var(--surface);padding:16px 18px 17px;display:flex;flex-direction:column;gap:4px;position:relative}
.tile .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .u{font-size:11.5px;color:var(--faint)}
.tile.accent{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 72%)}
.tile.accent .v{color:var(--accent)}
.tile.accent::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--accent)}
.tile.brassy::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--brass)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-open{background:var(--accent-soft);color:var(--accent)}
.b-done{background:var(--ok-soft);color:var(--ok)}
.b-closed{background:var(--surface-3);color:var(--muted)}
.chip{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--brass-soft);color:var(--brass);font-family:var(--mono);font-size:11px;font-weight:500;border:1px solid var(--brass-line)}
.chip.col{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-family:var(--sans);font-weight:600}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 13px;border-bottom:1px solid var(--border-strong);white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:1}
td{padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tfoot th{position:static;background:var(--surface-3);border-top:2px solid var(--accent);border-bottom:0;font-size:11px;color:var(--text);text-transform:none;letter-spacing:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:12.5px}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--accent-soft)}
tr.stripe td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.stripe-ok td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.stripe-off td:first-child{box-shadow:inset 3px 0 0 var(--border-strong)}
.rowbtn{opacity:.3;transition:opacity .12s}
tr:hover .rowbtn{opacity:1}
.empty{padding:48px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-family:var(--serif);font-size:16px;margin-bottom:5px}
.pager{display:flex;align-items:center;gap:11px;padding:12px 17px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);flex-wrap:wrap;background:var(--surface-2)}
.pager .spacer{margin-left:auto}

.prog{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:80px;flex:1}
.prog span{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog.full span{background:var(--ok)}

/* ---------- charts ---------- */
.chartwrap{position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--faint);font-family:var(--mono);font-size:10px}
.chart .bar{fill:var(--accent)}
.chart .bar-out{fill:var(--accent)}
.chart .bar-in{fill:var(--brass)}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .sw.in{background:var(--brass)}
.legend .sw.out{background:var(--accent)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:11.5px;font-family:var(--mono);white-space:nowrap;opacity:0;transform:translate(-50%,-118%);transition:opacity .1s;z-index:5;box-shadow:var(--shadow)}
.tip.on{opacity:1}
.ranklist{display:flex;flex-direction:column;gap:11px}
.rankrow{display:grid;grid-template-columns:minmax(0,1.05fr) 1.5fr auto;gap:13px;align-items:center}
.rankrow .rl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .rb{height:13px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.rankrow .rb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rankrow .rv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:66px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(880px,97vw);background:var(--bg);border-left:1px solid var(--border);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-head{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;gap:14px;align-items:flex-start;flex:none}
.drawer-head h2{font-size:19px}
.drawer-body{padding:20px 24px 48px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.drawer-body>*{flex:0 0 auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:15px;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv .v{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis}

/* in-app dialogs — the artifact frame blocks confirm()/prompt()/alert() */
.modalwrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,24,.55);backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow);max-width:460px;width:100%;overflow:hidden}
.modal h3{font-family:var(--serif);font-size:17px;padding:18px 20px 0}
.modal .mb{padding:9px 20px 18px;color:var(--muted);font-size:13.5px}
.modal .mb strong{color:var(--text)}
.modal .mf{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;background:var(--surface-2);border-top:1px solid var(--border)}
.modal input{margin-top:4px}
.btn-crit{background:var(--crit);border-color:var(--crit);color:#fff}
.btn-crit:hover{background:var(--crit);opacity:.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:13px;z-index:60;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:90vw;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:14px}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 6px;background:var(--surface-2)}
.subnav button{padding:11px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;font-size:13px}
.subnav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.subnav.page{border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;box-shadow:var(--shadow-sm);margin-bottom:-4px}
.subnav .tabct{margin-left:7px;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
.subnav button[aria-selected="true"] .tabct{color:var(--accent)}
.listedit{display:flex;flex-direction:column;max-height:440px;overflow:auto}
.listedit .row{display:flex;align-items:center;gap:9px;padding:7px 16px;border-bottom:1px solid var(--border)}
.listedit .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listedit .row .ct{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.hint{font-size:12px;color:var(--muted)}
.notice{padding:13px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:12.5px}
textarea{min-height:64px;resize:vertical;font-family:inherit}
/* bag ledger */
.bagtable{width:100%;border-collapse:collapse}
.bagtable th{padding:8px 10px;font-size:10px}
.bagtable td{padding:4px 6px;border-bottom:1px solid var(--border)}
.bagtable td input{padding:7px 9px;font-size:14px;font-weight:500;border-radius:6px;font-family:var(--mono)}
.bagtable td.ix{width:44px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted)}
.bagtable td.rm{width:40px;text-align:right}
.bagfoot{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:var(--surface-2);border-top:1px solid var(--border-strong)}
.bagfoot .ft{display:flex;flex-direction:column;gap:1px}
.bagfoot .ft .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bagfoot .ft .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.bagfoot .grow{margin-left:auto}
.quickbar{display:flex;align-items:center;gap:11px;padding:15px 18px;background:var(--accent-soft);border-bottom:1px solid var(--border);flex-wrap:wrap}
.quickbar .ql{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* ============ ZIP + XLSX ============ */
const CRC_T=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}return t;})();
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return(c^-1)>>>0;}
const TE=new TextEncoder();
function zipStore(files){
  const parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){
    const name=TE.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  let cd=0;for(const c of central)cd+=c.length;
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cd),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,eocd],{type:"application/zip"});
}
const xe=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const colName=n=>{let s="";n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;};
const dateSerial=iso=>{if(!iso)return null;const[y,m,d]=iso.split("-").map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000);};
const XL_STYLES=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

const ST={TITLE:1,H2:2,SUB:3,HEAD:4,TXT:5,INT:6,DEC:7,DATE:8,TOTL:9,TOTI:10,TOTD:11};
function xcell(ref,style,val,type){
  if(val==null||val==="")return `<c r="${ref}" s="${style}"/>`;
  if(type==="n")return `<c r="${ref}" s="${style}"><v>${val}</v></c>`;
  return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xe(val)}</t></is></c>`;
}
function buildXlsx({sheetName,title,context,cols,rows,totals}){
  const R=[];let r=1;
  const push=c=>{R.push(`<row r="${r}">${c}</row>`);r++;};
  push(xcell("A1",ST.TITLE,COMPANY+" — MAZHAR SONS TEXTILES"));
  push(xcell("A2",ST.H2,title));
  push(xcell("A3",ST.SUB,context||""));
  push("");
  const headRow=r;
  push(cols.map((c,i)=>xcell(colName(i)+r,ST.HEAD,c.label)).join(""));
  const first=r;
  for(const row of rows){
    push(cols.map((c,i)=>{
      const ref=colName(i)+r,v=row[c.key];
      if(c.type==="date")return xcell(ref,ST.DATE,dateSerial(v),"n");
      if(c.type==="int")return (v==null||v==="")?xcell(ref,ST.INT,null):xcell(ref,ST.INT,v,"n");
      if(c.type==="dec")return (v==null||v==="")?xcell(ref,ST.DEC,null):xcell(ref,ST.DEC,Math.round(v*100)/100,"n");
      return xcell(ref,ST.TXT,v);
    }).join(""));
  }
  const last=r-1;
  if(totals)push(cols.map((c,i)=>{
    const ref=colName(i)+r;
    if(i===0)return xcell(ref,ST.TOTL,"TOTAL");
    const v=totals[c.key];
    if(v==null)return xcell(ref,ST.TOTL,null);
    if(c.type==="int")return xcell(ref,ST.TOTI,v,"n");
    if(c.type==="dec")return xcell(ref,ST.TOTD,Math.round(v*100)/100,"n");
    return xcell(ref,ST.TOTL,v);
  }).join(""));
  const lastRow=r-1,lastCol=colName(cols.length-1);
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<dimension ref="A1:${lastCol}${lastRow}"/>
<sheetViews><sheetView showGridLines="0" tabSelected="1" workbookViewId="0">
<pane ySplit="${headRow}" topLeftCell="A${headRow+1}" activePane="bottomLeft" state="frozen"/>
<selection pane="bottomLeft" activeCell="A${headRow+1}" sqref="A${headRow+1}"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.width||14}" customWidth="1"/>`).join("")}</cols>
<sheetData>${R.join("")}</sheetData>
${last>=first?`<autoFilter ref="A${headRow}:${lastCol}${last}"/>`:""}
<mergeCells count="3"><mergeCell ref="A1:${lastCol}1"/><mergeCell ref="A2:${lastCol}2"/><mergeCell ref="A3:${lastCol}3"/></mergeCells>
<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
<pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  const f=(n,s)=>({name:n,data:TE.encode(s)});
  return zipStore([
    f("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`),
    f("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`),
    f("xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="${xe((sheetName||"Report").slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`),
    f("xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`),
    f("xl/styles.xml",XL_STYLES),

const $=s=>document.querySelector(s);
const el=(t,a,...kids)=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;
    if(k==="class")n.className=v;else if(k==="html")n.innerHTML=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?"":v);}
  for(const k of kids.flat()){if(k==null||k===false)continue;n.append(k.nodeType?k:document.createTextNode(k));}
  return n;};
const nf=(n,d=0)=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* The artifact runs in a sandboxed frame where confirm/prompt/alert never
   appear, so every dialog is built in-page and returns a promise. */
function dialog({title,body,fields,okLabel,danger,cancel=true}){
  return new Promise(resolve=>{
    const inputs={};
    const mb=el("div",{class:"mb"});
    if(body)mb.append(el("div",null,body));
    if(fields)fields.forEach(f=>{
      const i=el("input",{value:f.value||"",placeholder:f.placeholder||""});
      inputs[f.key]=i;
      mb.append(el("label",{class:"field",style:"margin-top:12px"},f.label,i));
    });
    const close=v=>{wrap.remove();document.removeEventListener("keydown",key);resolve(v);};
    const okBtn=el("button",{class:"btn "+(danger?"btn-crit":"btn-primary"),
      onclick:()=>close(fields?Object.fromEntries(Object.entries(inputs).map(([k,i])=>[k,i.value.trim()])):true)});
    okBtn.textContent=okLabel||"OK";
    const wrap=el("div",{class:"modalwrap",onclick:e=>{if(e.target===wrap&&cancel)close(null);}},
      el("div",{class:"modal",role:"dialog","aria-modal":"true"},
        el("h3",null,title),mb,
        el("div",{class:"mf"},
          cancel?el("button",{class:"btn",onclick:()=>close(null)},"Cancel"):null,okBtn)));
    function key(e){
      if(e.key==="Escape"&&cancel){e.stopPropagation();close(null);}
      else if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"){e.preventDefault();okBtn.click();}
    }
    document.addEventListener("keydown",key);
    document.body.append(wrap);
    const first=wrap.querySelector("input")||okBtn;first.focus();
    if(first.select)first.select();
  });
}
const ask=(title,body,okLabel,danger)=>dialog({title,body,okLabel:okLabel||"Confirm",danger});
const note=(title,body)=>dialog({title,body,okLabel:"Got it",cancel:false});

function allRows(){
  if(S.rowsCache)return S.rowsCache;
  const out=[];for(const m of S.months.values())for(const r of m.rows)out.push(r);
  out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1));
  return S.rowsCache=out;
}
const invalidate=()=>{S.rowsCache=null;S.pRowsCache=null;};
function allPRows(){
  if(S.pRowsCache)return S.pRowsCache;
  const out=[];for(const m of S.pmonths.values())for(const r of m.rows)out.push(r);
  out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1));
  return S.pRowsCache=out;
}

/* ============ theme ============ */
function initTheme(){
  let t=null;try{t=localStorage.getItem("mzl-theme");}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  paintThemeBtn();
}
function currentTheme(){
  const a=document.documentElement.getAttribute("data-theme");
  if(a)return a;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
}
function toggleTheme(){
  const next=currentTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("mzl-theme",next);}catch(e){}
  paintThemeBtn();
}
function paintThemeBtn(){
  const b=$("#themeBtn");if(!b)return;
  const dark=currentTheme()==="dark";
  b.textContent="";
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width","1.6");s.setAttribute("stroke-linecap","round");
  s.innerHTML=dark?'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'
    :'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>';
  b.append(s,el("span",null,dark?"Switch to light":"Switch to dark"));
}

function enqueue(fn){
  S.writeQueue=S.writeQueue.then(async()=>{
    setSave("saving","Saving…");
    try{await fn();setSave("idle","All changes saved");}
    catch(e){console.error(e);setSave("error","Not saved — "+((e&&e.code)||"error"));toast("Could not save: "+((e&&e.message)||e));throw e;}
  }).catch(()=>{});
  return S.writeQueue;
}

async function loadCore(){

function orderMatches(o,r){
  if(r.client!==o.client||r.item!==o.item)return false;
  const lot=(o.lot||"").trim().toLowerCase();
  if(lot&&!String(r.lot||"").toLowerCase().includes(lot))return false;
  if(o.dateOpened&&r.date<o.dateOpened)return false;
  if(o.closingDate&&r.date>o.closingDate)return false;
  return true;
}
function orderStats(o){
  const rows=allRows().filter(r=>orderMatches(o,r));
  const bags=sum(rows,"bags"),lbs=sum(rows,"lbs"),kg=sum(rows,"kg");
  const cb=o.contractedBags||0,cl=o.contractedLbs||0;
  const pct=cl>0?Math.min(100,lbs/cl*100):(cb>0?Math.min(100,bags/cb*100):0);
  return{rows,bags,lbs,kg,openBags:cb-bags,openLbs:cl-lbs,pct,done:(cb>0&&bags>=cb)||(cl>0&&lbs>=cl)};
}
const isClosed=o=>String(o.status).toLowerCase()==="closed";
function orderBadge(o,st){
  if(isClosed(o))return{cls:"b-closed",txt:"Closed",stripe:"stripe-off"};
  if(st.done)return{cls:"b-done",txt:"Fulfilled",stripe:"stripe-ok"};
  return{cls:"b-open",txt:"Open",stripe:"stripe"};
}
function filterRows({client,item,from,to,q}){
  const ql=(q||"").trim().toLowerCase();
  return allRows().filter(r=>{
    if(client&&r.client!==client)return false;
    if(item&&r.item!==item)return false;
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    if(ql&&!((r.client+" "+r.item+" "+(r.lot||"")+" "+(r.challan||"")+" "+(r.billty||"")).toLowerCase().includes(ql)))return false;
    return true;
  });
}
function filterContext(f){
  const p=[];
  if(f.client)p.push(f.client);if(f.item)p.push(f.item);
  if(f.from||f.to)p.push((f.from?fmtDate(f.from):"start")+" to "+(f.to?fmtDate(f.to):"today"));
  return p.length?p.join("  ·  "):"All clients · all items · full history";
}

function dispatchReport(rows,f,titleOverride){
  const byMonth=new Map(),byClient=new Map(),byItem=new Map();
  rows.forEach(r=>{
    const m=byMonth.get(r.date.slice(0,7))||{k:r.date.slice(0,7),n:0,bags:0,kg:0,lbs:0};
    m.n++;m.bags+=r.bags||0;m.kg+=r.kg||0;m.lbs+=r.lbs||0;byMonth.set(m.k,m);
    const c=byClient.get(r.client)||{k:r.client,n:0,bags:0,kg:0,lbs:0};
    c.n++;c.bags+=r.bags||0;c.kg+=r.kg||0;c.lbs+=r.lbs||0;byClient.set(c.k,c);
    const i=byItem.get(r.item)||{k:r.item,n:0,bags:0,kg:0,lbs:0};
    i.n++;i.bags+=r.bags||0;i.kg+=r.kg||0;i.lbs+=r.lbs||0;byItem.set(i.k,i);
  });
  const sumCols=lbl=>[{label:lbl,key:"k"},{label:"Deliveries",key:"n",align:"r",fmt:r=>nf(r.n)},
    {label:"Bags",key:"bags",align:"r",fmt:r=>nf(r.bags)},{label:"Kg",key:"kg",align:"r",fmt:r=>nf(r.kg,2)},
    {label:"Lbs",key:"lbs",align:"r",fmt:r=>nf(r.lbs,2)}];
  const tot={n:nf(rows.length),bags:nf(sum(rows,"bags")),kg:nf(sum(rows,"kg"),2),lbs:nf(sum(rows,"lbs"),2)};
  const months=[...byMonth.values()].sort((a,b)=>a.k<b.k?1:-1).slice(0,18).map(x=>Object.assign({},x,{k:monthFull(x.k)}));
  const clients=[...byClient.values()].sort((a,b)=>b.lbs-a.lbs).slice(0,15);
  const items=[...byItem.values()].sort((a,b)=>b.lbs-a.lbs).slice(0,15);
  const openO=S.orders.filter(o=>!isClosed(o)).map(o=>({o,st:orderStats(o)}));
  const detailCap=1200;
  const sections=[
    {heading:"Dispatch by month (most recent 18)",cols:sumCols("Month"),rows:months,totals:tot},
    {heading:"Top clients by weight",cols:sumCols("Client"),rows:clients},
    {heading:"Top items by weight",cols:sumCols("Item"),rows:items},
  ];
  if(openO.length)sections.push({heading:"Open order book",
    cols:[{label:"Order",key:"id",fmt:r=>r.o.id},{label:"Client",key:"c",fmt:r=>r.o.client},
      {label:"Item",key:"i",fmt:r=>r.o.item+(r.o.lot?" ("+r.o.lot+")":"")},
      {label:"Opened",key:"d",fmt:r=>fmtDate(r.o.dateOpened)},
      {label:"Contracted Lbs",key:"cl",align:"r",fmt:r=>nf(r.o.contractedLbs,0)},
      {label:"Delivered Lbs",key:"dl",align:"r",fmt:r=>nf(r.st.lbs,0)},
      {label:"Open Lbs",key:"ol",align:"r",fmt:r=>nf(Math.max(0,r.st.openLbs),0)},
      {label:"% Done",key:"p",align:"r",fmt:r=>Math.round(r.st.pct)+"%"}],
    rows:openO.sort((a,b)=>b.st.openLbs-a.st.openLbs)});
  sections.push({heading:"Delivery detail",
    note:rows.length>detailCap?`${nf(rows.length)} deliveries match this selection — the detail table is limited to the ${nf(detailCap)} most recent. Use the Excel export for the complete register.`:null,
    cols:[{label:"Date",key:"date",fmt:r=>fmtDate(r.date)},{label:"Challan",key:"challan",fmt:r=>r.challan||"—"},
      {label:"Client",key:"client"},{label:"Item",key:"item"},{label:"Lot",key:"lot",fmt:r=>r.lot||"—"},
      {label:"Bags",key:"bags",align:"r",fmt:r=>nf(r.bags)},{label:"Kg",key:"kg",align:"r",fmt:r=>nf(r.kg,2)},
      {label:"Lbs",key:"lbs",align:"r",fmt:r=>nf(r.lbs,2)}],
    rows:rows.slice(0,detailCap),totals:{bags:nf(sum(rows,"bags")),kg:nf(sum(rows,"kg"),2),lbs:nf(sum(rows,"lbs"),2)}});
  return reportHTML({
    title:titleOverride||"Sales & Dispatch Report",
    context:filterContext(f),
    kpis:[{k:"Deliveries",v:nf(rows.length),u:"challan lines"},{k:"Bags dispatched",v:nf(sum(rows,"bags")),u:"bags"},
      {k:"Weight",v:nf(sum(rows,"kg"),0),u:"kg"},{k:"Weight",v:nf(sum(rows,"lbs"),0),u:"lbs"}],
    sections});

/* ============ combobox ============ */
function combo({value,list,placeholder,onChange,allowFree,onInputChange}){
  const wrap=el("div",{class:"combo"});
  const input=el("input",{type:"text",value:value||"",placeholder:placeholder||"Type to search…",autocomplete:"off",spellcheck:"false"});
  const menu=el("div",{class:"combo-menu",hidden:true});
  const clear=el("button",{class:"clear",type:"button",title:"Clear",hidden:!value,
    onmousedown:e=>{e.preventDefault();input.value="";clear.hidden=true;commit("");}},"×");
  let idx=-1,filtered=[],last=value||"";
  const hl=(v,q)=>{if(!q)return document.createTextNode(v);
    const i=v.toLowerCase().indexOf(q);if(i<0)return document.createTextNode(v);
    const f=document.createDocumentFragment();
    f.append(v.slice(0,i),el("mark",null,v.slice(i,i+q.length)),v.slice(i+q.length));return f;};
  function paint(){
    const q=input.value.trim().toLowerCase();
    filtered=(!q?list.slice():list.filter(x=>x.toLowerCase().includes(q))
      .sort((a,b)=>(a.toLowerCase().startsWith(q)?0:1)-(b.toLowerCase().startsWith(q)?0:1)||a.localeCompare(b))).slice(0,60);
    menu.textContent="";
    if(!filtered.length)menu.append(el("div",{class:"combo-empty"},allowFree?"New name — will be added to the list":"No match"));
    filtered.forEach((v,i)=>menu.append(el("div",{class:"combo-item"+(i===idx?" on":""),
      onmousedown:e=>{e.preventDefault();commit(v);}},hl(v,q))));
    menu.hidden=false;
  }
  function hide(){menu.hidden=true;idx=-1;}
  function commit(v){input.value=v;last=v;clear.hidden=!v;hide();onChange(v);}
  input.addEventListener("focus",()=>{idx=-1;paint();});
  input.addEventListener("input",()=>{idx=-1;clear.hidden=!input.value;paint();if(onInputChange)onInputChange(input.value);});
  input.addEventListener("blur",()=>setTimeout(()=>{
    hide();
    const v=input.value.trim();
    if(allowFree){if(v!==last)commit(v);return;}
    if(!v){if(last!=="")commit("");return;}
    const exact=list.find(x=>x.toLowerCase()===v.toLowerCase());
    if(exact)commit(exact);
    else if(filtered.length===1)commit(filtered[0]);
    else{input.value=last;clear.hidden=!last;}
  },140));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();if(menu.hidden)paint();
      idx=Math.max(0,Math.min(filtered.length-1,idx+(e.key==="ArrowDown"?1:-1)));
      [...menu.children].forEach((c,i)=>c.classList.toggle("on",i===idx));
      const on=menu.children[idx];if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest"});
    }else if(e.key==="Enter"){
      e.preventDefault();
      if(idx>=0&&filtered[idx])commit(filtered[idx]);
      else if(filtered.length===1)commit(filtered[0]);
      else if(allowFree)commit(input.value.trim());
      else hide();
    }else if(e.key==="Escape"){input.value=last;hide();}
  });
  wrap.append(input,clear,menu);
  wrap.getValue=()=>input.value.trim();
  wrap.setValue=v=>{input.value=v||"";last=input.value;clear.hidden=!input.value;};
  wrap.focus=()=>input.focus();
  return wrap;
}

/* ============ charts ============ */
function tipFor(w){if(!w._tip){w._tip=el("div",{class:"tip"});w.append(w._tip);}return w._tip;}
function monthlyChart(series){
  const W=760,H=214,PL=56,PR=8,PT=14,PB=26,iw=W-PL-PR,ih=H-PT-PB;
  const max=Math.max(1,...series.map(d=>d.lbs));
  const step=Math.pow(10,Math.floor(Math.log10(max)));
  const nice=Math.ceil(max/step)*step;
  const gap=iw/series.length,bw=Math.max(3,gap*0.66);
  const ns="http://www.w3.org/2000/svg",wrap=el("div",{class:"chartwrap"});
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","chart");svg.setAttribute("role","img");
  svg.setAttribute("aria-label",`Dispatched weight by month across ${series.length} months, peak ${Math.round(nice).toLocaleString()} lbs`);
  const mk=(t,a)=>{const n=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n;};
  for(let i=0;i<=4;i++){
    const v=nice/4*i,y=PT+ih-ih*(v/nice);
    svg.append(mk("line",{x1:PL,x2:W-PR,y1:y,y2:y,class:"grid"}));
    const t=mk("text",{x:PL-9,y:y+3.5,class:"axis","text-anchor":"end"});
    t.textContent=v>=1000?Math.round(v/1000)+"k":Math.round(v);svg.append(t);
  }
  series.forEach((d,i)=>{
    const h=Math.max(d.lbs>0?2:0,ih*(d.lbs/nice)),x=PL+gap*i+(gap-bw)/2,y=PT+ih-h;
    const r=mk("rect",{x,y,width:bw,height:h,rx:Math.min(3,bw/2),class:"bar"});
    r.style.cursor="crosshair";
    r.addEventListener("mousemove",ev=>{const b=wrap.getBoundingClientRect();const t=tipFor(wrap);
      t.textContent=`${monthFull(d.month)} · ${Math.round(d.lbs).toLocaleString()} lbs · ${d.bags} bags · ${d.n} challans`;
      t.style.left=(ev.clientX-b.left)+"px";t.style.top=(ev.clientY-b.top-6)+"px";t.classList.add("on");});
    r.addEventListener("mouseleave",()=>{if(wrap._tip)wrap._tip.classList.remove("on");});
    svg.append(r);
    const every=series.length>16?3:(series.length>8?2:1);
    if(i%every===0||i===series.length-1){
      const t=mk("text",{x:x+bw/2,y:H-8,class:"axis","text-anchor":"middle"});
      t.textContent=monthLabel(d.month);svg.append(t);

}
/* Raw yarn in against finished yarn out, month by month. Deliberately two bars
   rather than a running balance: what is bought and what is sold are different
   goods until production is in the picture, and pretending otherwise would put
   a wrong number on the screen. */
function flowChart(series){
  const W=760,H=232,PL=56,PR=8,PT=14,PB=44,iw=W-PL-PR,ih=H-PT-PB;
  const max=Math.max(1,...series.map(d=>Math.max(d.inKg,d.outKg)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));
  const nice=Math.ceil(max/step)*step;
  const gap=iw/series.length,bw=Math.max(2,(gap*0.72)/2);
  const ns="http://www.w3.org/2000/svg",wrap=el("div",{class:"chartwrap"});
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","chart");svg.setAttribute("role","img");
  svg.setAttribute("aria-label",`Yarn in against yarn out by month across ${series.length} months, in kilograms, peak ${Math.round(nice).toLocaleString()} kg`);
  const mk=(t,a)=>{const n=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);return n;};
  for(let i=0;i<=4;i++){
    const v=nice/4*i,y=PT+ih-ih*(v/nice);
    svg.append(mk("line",{x1:PL,x2:W-PR,y1:y,y2:y,class:"grid"}));
    const t=mk("text",{x:PL-9,y:y+3.5,class:"axis","text-anchor":"end"});
    t.textContent=v>=1000?Math.round(v/1000)+"k":Math.round(v);svg.append(t);
  }
  series.forEach((d,i)=>{
    const x0=PL+gap*i+(gap-bw*2)/2;
    [["inKg","bar-in",0],["outKg","bar-out",bw]].forEach(([k,cls,dx])=>{
      const h=Math.max(d[k]>0?2:0,ih*(d[k]/nice)),y=PT+ih-h;
      const r=mk("rect",{x:x0+dx,y,width:bw,height:h,rx:Math.min(2,bw/2),class:cls});
      r.style.cursor="crosshair";
      r.addEventListener("mousemove",ev=>{const b=wrap.getBoundingClientRect(),t=tipFor(wrap);
        t.textContent=`${monthFull(d.month)} · in ${Math.round(d.inKg).toLocaleString()} kg · out ${Math.round(d.outKg).toLocaleString()} kg`;
        t.style.left=(ev.clientX-b.left)+"px";t.style.top=(ev.clientY-b.top-6)+"px";t.classList.add("on");});
      r.addEventListener("mouseleave",()=>{if(wrap._tip)wrap._tip.classList.remove("on");});
      svg.append(r);
    });
    const every=series.length>16?3:(series.length>8?2:1);
    if(i%every===0||i===series.length-1){
      const t=mk("text",{x:x0+bw,y:H-26,class:"axis","text-anchor":"middle"});
      t.textContent=monthLabel(d.month);svg.append(t);
    }
  });
  wrap.append(svg,el("div",{class:"legend"},
    el("span",null,el("i",{class:"sw in"}),"Purchased in (raw yarn)"),
    el("span",null,el("i",{class:"sw out"}),"Dispatched out (finished yarn)")));
  return wrap;
}
function rankChart(items,unit){
  const max=Math.max(1,...items.map(d=>d.value));
  const wrap=el("div",{class:"ranklist",role:"list"});
  items.forEach(d=>wrap.append(el("div",{class:"rankrow",role:"listitem",title:d.label+" — "+nf(d.value,0)+" "+unit},
    el("span",{class:"rl"},d.label),el("span",{class:"rb"},el("i",{style:"width:"+Math.max(1.5,d.value/max*100)+"%"})),
    el("span",{class:"rv"},nf(d.value,0)))));

}

/* Follows the book actually in use: takes the newest date that has numbered
   challans and steps on from the highest number written that day. Falls back
   to the last number saved in meta so the form is instant before history loads. */
function nextChallanNo(){
  const n=v=>{const x=parseInt(String(v||"").replace(/[^0-9]/g,""),10);return(!isNaN(x)&&x<100000)?x:null;};
  let day=null,max=0;
  for(const r of allRows()){
    const v=n(r.challan);
    if(v==null)continue;
    if(day===null)day=r.date;
    if(r.date!==day)break;
    if(v>max)max=v;
  }
  if(!max)max=n(S.meta&&S.meta.lastChallanNo)||0;
  return max?String(max+1):"";
}

.copytag{display:inline-block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#8C6A24;font-weight:700;border:1px solid #D9C89C;padding:2px 7px;border-radius:3px;margin-bottom:4px;white-space:nowrap}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;border-bottom:2.5px solid #1F3864;padding-bottom:8px}
.co{font-family:"IBM Plex Serif",Georgia,serif;font-size:18px;font-weight:600;color:#1F3864;letter-spacing:-.02em;line-height:1.15}
.co small{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8C6A24;font-weight:700;margin-top:3px}
.cn{text-align:right}
.cn .t{display:block;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#4A5162;font-weight:700}
.cn .no{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;color:#1F3864;line-height:1.1}
.cn .dt{display:block;font-size:11.5px;color:#333A4A;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 218px;gap:18px;margin:9px 0 8px}
.line{display:flex;gap:9px;padding:2px 0;align-items:baseline}
.lb{flex:0 0 108px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6B7180;font-weight:700}
.vl{font-size:13px;font-weight:600;color:#121722}
.vl.str{font-size:14px;font-weight:700}
.vl.big{font-size:16.5px;font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;color:#1F3864}
.lot{background:#F2EAD8;border:1px solid #D9C89C;color:#8C6A24;padding:0 5px;border-radius:3px;font-size:12.5px}
.tot{border:1.5px solid #1F3864}
.tl{display:flex;justify-content:space-between;align-items:baseline;padding:4.5px 10px;border-bottom:1px solid #E4E1D9}
.tl:last-child{border-bottom:0}
.tl span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#4A5162;font-weight:700}
.tl b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tl.hi{background:#EFF3FA}
.tl.hi b{font-size:16px;color:#1F3864}
table.bags{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:2px}
table.bags th{background:#1F3864;color:#fff;padding:4px 7px;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;text-align:left;font-weight:700}
table.bags td{padding:2.6px 7px;border-bottom:1px solid #E8E6E0;font-weight:600}
table.bags .r{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
table.bags .ix{width:24px;color:#8A90A1;font-family:"IBM Plex Mono",monospace;text-align:center;font-weight:500}
table.bags .gap{width:14px;background:#fff;border:0}
table.bags tfoot th{background:#EFF3FA;color:#1F3864;border-top:1.5px solid #1F3864;font-size:10.5px;text-transform:none;letter-spacing:0;padding:4px 7px}
table.bags tfoot th.r{font-family:"IBM Plex Mono",monospace}
.nobags{font-size:11.5px;color:#6B7180;border:1px dashed #C9C4B8;padding:9px;text-align:center;margin:4px 0}
.terms{font-size:11px;color:#2B3242;background:#F6F5F1;border-left:3px solid #8C6A24;padding:6px 10px;margin:8px 0 0;font-weight:500}
.sign{display:flex;gap:52px;margin-top:16px}
.sign div{flex:1;font-size:11px;color:#2B3242}
.sign b{font-weight:700}
.sign .sl{display:block;border-top:1px solid #6E6E6E;margin-bottom:4px;height:26px}
.sign small{color:#8A90A1;font-size:9px;font-weight:500}
.tear{border-top:2px dashed #9AA0AE;margin:13px 0 11px;text-align:center;height:0}
.tear span{display:inline-block;position:relative;top:-8px;background:#fff;padding:0 12px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#8A90A1;font-weight:600}
@media print{
  @page{size:A4 portrait;margin:9mm}
  body{background:#fff;font-size:11.5px}
  .bar{display:none}
  .sheet{margin:0;padding:0;box-shadow:none;max-width:none;break-after:page}
  .sheet:last-of-type{break-after:auto}
  .sheet.tall .challan{break-after:page}
  .sheet.tall .challan:last-child{break-after:auto}
  .challan{break-inside:avoid}
  /* two-up: each copy fills exactly half the sheet so the tear line lands
     dead centre and the signatures sit at the foot of each half */

  .sheet:not(.tall) .challan{flex:1 1 0;min-height:0;display:flex;flex-direction:column}

  .sheet:not(.tall) .co{font-size:15.5px}
  .sheet:not(.tall) .co small{font-size:8px;margin-top:2px}
  .sheet:not(.tall) .cn .no{font-size:18px}
  .sheet:not(.tall) .cn .dt{font-size:10px}
  .sheet:not(.tall) .copytag{margin-bottom:2px;padding:1px 6px}
  .sheet:not(.tall) .grid{margin:5px 0 4px;gap:13px;grid-template-columns:1fr 196px}
  .sheet:not(.tall) .line{padding:1px 0}
  .sheet:not(.tall) .vl{font-size:11.5px}
  .sheet:not(.tall) .vl.str{font-size:12px}
  .sheet:not(.tall) .vl.big{font-size:14px}
  .sheet:not(.tall) .tl{padding:2.6px 9px}
  .sheet:not(.tall) .tl b{font-size:12.5px}
  .sheet:not(.tall) .tl.hi b{font-size:13.5px}
  .sheet:not(.tall) table.bags{font-size:10px}
  .sheet:not(.tall) table.bags th{padding:2.6px 6px}
  .sheet:not(.tall) table.bags td{padding:1.5px 6px}
  .sheet:not(.tall) table.bags tfoot th{font-size:9.5px;padding:2.6px 6px}
  .sheet:not(.tall) .terms{margin-top:5px;padding:4px 9px;font-size:9.5px}
  .sheet:not(.tall) .sign{margin-top:8px;gap:44px}
  .sheet:not(.tall) .sign .sl{height:16px;margin-bottom:3px}
  .sheet:not(.tall) .sign div{font-size:10px}
  .sheet:not(.tall) .sign small{font-size:8.5px}
  .sheet:not(.tall) .tear{margin:7px 0 6px}
  .sheet:not(.tall) .tear span{font-size:8px}
  .tear span{background:#fff}
  thead{display:table-header-group}
  tr{break-inside:avoid}
}

const printChallan=c=>download("challan-"+(c.challan||todayISO())+".html",challanHTML([c]));
async function printDayChallans(rows){
  if(!rows.length){toast("Nothing to print in this selection");return;}
  const CAP=40;
  if(rows.length>CAP&&!await ask("Print "+CAP+" challans?",
    `${nf(rows.length)} deliveries match the current filters. Only the ${CAP} most recent will be printed — narrow the date filter to print a specific day.`,
    "Print "+CAP))return;
  const list=rows.slice(0,CAP).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:
    String(a.challan||"").localeCompare(String(b.challan||""),undefined,{numeric:true}));
  download("challans-"+todayISO()+".html",challanHTML(list));
}
async function addDelivery(rec){
  await ensureHistory();
  const key=rec.date.slice(0,7);
  if(!S.months.has(key))S.months.set(key,{month:key,rows:[]});
  const n=parseInt(String(rec.challan||"").replace(/[^0-9]/g,""),10);
  if(!isNaN(n)&&n<100000){
    const prev=parseInt(String(S.meta.lastChallanNo||0),10)||0;
    if(n>=prev){S.meta=Object.assign({},S.meta,{lastChallanNo:n,lastChallanDate:rec.date});enqueue(saveMeta);}
  }
  S.months.get(key).rows.push(Object.assign({id:uid("n"),src:"app",note:""},rec));
  invalidate();learnNames(rec);
  enqueue(()=>saveMonth(key));
  toast("Saved · "+rec.client+" · "+(rec.challan||fmtDate(rec.date)));
}
async function updateDelivery(id,rec){
  await ensureHistory();
  let oldKey=null;for(const[k,m]of S.months)if(m.rows.some(r=>r.id===id))oldKey=k;
  if(!oldKey)return;
  const newKey=rec.date.slice(0,7),m=S.months.get(oldKey),i=m.rows.findIndex(r=>r.id===id);
  const merged=Object.assign({},m.rows[i],rec);
  if(newKey===oldKey){m.rows[i]=merged;invalidate();learnNames(rec);enqueue(()=>saveMonth(oldKey));}
  else{m.rows.splice(i,1);
    if(!S.months.has(newKey))S.months.set(newKey,{month:newKey,rows:[]});
    S.months.get(newKey).rows.push(merged);invalidate();learnNames(rec);
    enqueue(async()=>{await saveMonth(oldKey);await saveMonth(newKey);});}
  toast("Delivery updated");
}
async function removeDelivery(r){
  const ok=await ask("Delete this delivery?",
    `Challan ${r.challan||"—"} · ${r.client} · ${fmtDate(r.date)} · ${nf(r.bags)} bags · ${nf(r.kg,2)} kg. This cannot be undone.`,
    "Delete",true);
  if(!ok)return;
  const key=r.date.slice(0,7),m=S.months.get(key);if(!m)return;
  m.rows=m.rows.filter(x=>x.id!==r.id);invalidate();
  enqueue(()=>saveMonth(key));
  toast("Delivery deleted");render();
}
function learnNames(rec){
  if(rec.client&&!S.clients.includes(rec.client)){S.clients.push(rec.client);S.clients.sort();enqueue(()=>saveRefs("clients"));}
  if(rec.item&&!S.items.includes(rec.item)){S.items.push(rec.item);S.items.sort();enqueue(()=>saveRefs("items"));}
}

      el("td",{class:"n"},nf(st.bags),el("br"),el("span",{class:"hint num"},nf(st.lbs,0)+" lbs")),
      el("td",{class:"n"},nf(Math.max(0,st.openBags)),el("br"),el("span",{class:"hint num"},nf(Math.max(0,st.openLbs),0)+" lbs")),
      el("td",null,progress(st.pct)),el("td",null,el("span",{class:"badge "+b.cls},b.txt)),

function editOrder(o){
  const isNew=!o;
  const r=o||{client:"",item:"",lot:"",po:"",contractedBags:"",contractedLbs:"",dateOpened:todayISO(),status:"Open",closingDate:"",notes:""};
  const f={};
  f.clientC=combo({value:r.client,list:S.clients,placeholder:"Type a client…",allowFree:true,onChange:()=>{}});
  f.itemC=combo({value:r.item,list:S.items,placeholder:"Type an item…",allowFree:true,onChange:()=>{}});
  f.lot=el("input",{value:r.lot||"",placeholder:"blank = any lot",maxlength:"12"});
  f.po=el("input",{value:r.po||"",placeholder:"optional — client's reference"});
  f.cb=el("input",{type:"number",step:"1",value:r.contractedBags==null?"":r.contractedBags});
  f.cl=el("input",{type:"number",step:"0.01",value:r.contractedLbs==null?"":r.contractedLbs});
  f.opened=el("input",{type:"date",value:r.dateOpened||todayISO()});
  f.status=el("select",null,["Open","Closed"].map(s=>el("option",{value:s,selected:s===r.status?true:null},s)));
  f.closing=el("input",{type:"date",value:r.closingDate||""});
  f.notes=el("textarea",{placeholder:"Payment or delivery terms, packing instructions — carried onto every challan raised against this order"},r.notes||"");
  const status=el("div",{class:"hint"});
  const save=async()=>{
    const rec={client:f.clientC.getValue(),item:f.itemC.getValue(),lot:f.lot.value.trim(),po:f.po.value.trim(),
      contractedBags:num(f.cb.value),contractedLbs:num(f.cl.value),dateOpened:f.opened.value,
      status:f.status.value,closingDate:f.closing.value||"",notes:f.notes.value.trim()};
    if(!rec.client||!rec.item){status.textContent="Client and item are required.";status.style.color="var(--crit)";return;}
    if(rec.contractedBags==null&&rec.contractedLbs==null){status.textContent="Enter contracted bags or contracted lbs.";status.style.color="var(--crit)";return;}
    let order;
    if(isNew){
      const seq=S.meta.nextOrderSeq||(S.orders.length+1);
      order=Object.assign({id:"ORD-"+String(seq).padStart(4,"0"),createdAt:todayISO()},rec);
      S.orders.push(order);S.meta=Object.assign({},S.meta,{nextOrderSeq:seq+1});
      enqueue(async()=>{await saveOrderDoc(order);await saveMeta();});
      toast("Order "+order.id+" created");
    }else{order=Object.assign(o,rec);enqueue(()=>saveOrderDoc(order));toast("Order "+order.id+" updated");}
    learnNames(rec);closeDrawer();render();
  };
  openDrawer(isNew?"New order":"Edit "+o.id,isNew?"Contract a client order":o.client,host=>{
    host.append(el("div",{class:"card"},el("div",{class:"card-body",style:"display:flex;flex-direction:column;gap:15px"},
      el("div",{class:"formgrid"},
        el("label",{class:"field",style:"grid-column:span 2"},"Client",f.clientC),
        el("label",{class:"field",style:"grid-column:span 2"},"Item / yarn spec",f.itemC),
        el("label",{class:"field"},"Lot",f.lot),
        el("label",{class:"field",style:"grid-column:span 2"},"PO / contract no.",f.po),
        el("label",{class:"field"},"Contracted bags",f.cb),
        el("label",{class:"field"},"Contracted lbs",f.cl),
        el("label",{class:"field"},"Date opened",f.opened),
        el("label",{class:"field"},"Status",f.status),
        el("label",{class:"field"},"Closing date",f.closing),
        el("label",{class:"field",style:"grid-column:1/-1"},"Notes / delivery terms",f.notes)),
      el("div",{style:"display:flex;gap:11px;align-items:center;flex-wrap:wrap"},
        el("button",{class:"btn btn-primary",onclick:save},"Save order"),
        el("button",{class:"btn",onclick:closeDrawer},"Cancel"),
        !isNew?el("button",{class:"btn btn-danger",onclick:async()=>{
          if(!await ask("Delete order "+o.id+"?","The deliveries recorded against it are not affected — only the contract is removed.","Delete",true))return;
          S.orders=S.orders.filter(x=>x.id!==o.id);
          await enqueue(()=>S.db.doc("orders/"+o.id).delete());
          toast("Order deleted");closeDrawer();render();}},svgIcon("trash"),"Delete"):null,
        status))));
    host.append(el("div",{class:"notice"},"Leave Lot blank to count every lot of this item. Contracted lbs drives the progress bar when set."));
  });
}

/* Renaming a reference name rewrites it through every stored record on that
   side, which is also how two spellings of one name get merged into one. */
async function renameName(which,oldName){
  const next=await askText("Rename everywhere","New name",oldName);
  if(next==null)return;
  const v=next.trim();if(!v||v===oldName)return;
  await ensureHistory();
  const ref=REFS[which],field=ref.field,sales=ref.side==="sales";
  const months=sales?S.months:S.pmonths,touched=new Set();
  for(const[k,m]of months){let hit=false;m.rows.forEach(r=>{if(r[field]===oldName){r[field]=v;hit=true;}});if(hit)touched.add(k);}
  const orders=(sales?S.orders:S.porders).filter(o=>o[field]===oldName);orders.forEach(o=>o[field]=v);
  const list=ref.get();
  const i=list.indexOf(oldName);if(i>=0)list.splice(i,1);
  if(!list.includes(v))list.push(v);
  list.sort();invalidate();
  await enqueue(async()=>{
    for(const k of touched)await(sales?saveMonth(k):savePMonth(k));
    for(const o of orders)await(sales?saveOrderDoc(o):savePOrderDoc(o));
    await saveRefs(which);});
  toast(`Renamed in ${touched.size} month${touched.size===1?"":"s"}${orders.length?" and "+orders.length+" order(s)":""}`);
  render();
}
async function removeName(which,name,count){
  const noun=REFS[which].side==="sales"?"delivery":"receipt";
  if(count>0){await note("Still in use",
    `“${name}” is used by ${nf(count)} stored ${count===1?noun:noun+"s"}. Rename it instead — removing it from the list would only make it reappear.`);return;}
  const list=REFS[which].get();
  const i=list.indexOf(name);if(i<0)return;
  list.splice(i,1);await enqueue(()=>saveRefs(which));toast("Removed "+name);render();
}

/* ============ PURCHASE / INCOMING ============
   Mirrors the sales side: a register of what arrived, and an order book of what
   was contracted for. Kept as its own set of documents (purchases/ and porders/)
   rather than folded into deliveries, because an incoming line is counted in
   bags-or-cartons-or-pallets and carries a colour, which a challan line does not. */
const PUNITS=["BAG","CTN","PLT","CONE","BOX","GITTI","CHAKKA","KG"];
const pKg=r=>r.kg||0, pLbs=r=>r.lbs||(r.kg?r.kg*KG_TO_LBS:0);
function filterPRows({supplier,item,color,from,to,q}){
  const ql=(q||"").trim().toLowerCase();
  return allPRows().filter(r=>{
    if(supplier&&r.supplier!==supplier)return false;
    if(item&&r.item!==item)return false;
    if(color&&(r.color||"")!==color)return false;
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    if(ql&&!((r.supplier+" "+r.item+" "+(r.color||"")+" "+(r.lot||"")+" "+(r.ref||"")+" "+(r.notes||"")).toLowerCase().includes(ql)))return false;
    return true;
  });
}
function pFilterContext(f){
  const p=[];
  if(f.supplier)p.push(f.supplier);if(f.item)p.push(f.item);if(f.color)p.push(f.color);
  if(f.from||f.to)p.push((f.from?fmtDate(f.from):"start")+" to "+(f.to?fmtDate(f.to):"today"));
  return p.length?p.join("  ·  "):"All suppliers · all items · full history";
}
const PUR_COLS=[{label:"Date",key:"date",type:"date",width:13},
  {label:"Supplier",key:"supplier",type:"text",width:28},
  {label:"Item / Yarn Spec",key:"item",type:"text",width:30},

  {label:"Lot Code",key:"lot",type:"text",width:14},
  {label:"Qty",key:"qty",type:"dec",width:9},{label:"Unit",key:"unit",type:"text",width:8},
  {label:"Per-Unit Wt",key:"uw",type:"text",width:12},
  {label:"Weight (Kg)",key:"kg",type:"dec",width:13},{label:"Weight (Lbs)",key:"lbs",type:"dec",width:13},
  {label:"Ref (D.O / Builty)",key:"ref",type:"text",width:18},
  {label:"Notes",key:"notes",type:"text",width:22}];
function exportPurchasesXlsx(rows,title,context,filename){
  download(filename,buildXlsx({sheetName:"Purchases",title,context,cols:PUR_COLS,rows,
    totals:{qty:sum(rows,"qty"),kg:sum(rows,"kg"),lbs:sum(rows,"lbs")}}));
}
function purchaseReport(rows,f,titleOverride){
  const bySup=new Map(),byItem=new Map(),byMonth=new Map(),byColor=new Map();
  const add=(map,k,r)=>{const e=map.get(k)||{k,n:0,qty:0,kg:0,lbs:0};
    e.n++;e.qty+=r.qty||0;e.kg+=pKg(r);e.lbs+=pLbs(r);map.set(k,e);};
  rows.forEach(r=>{add(byMonth,r.date.slice(0,7),r);add(bySup,r.supplier,r);
    add(byItem,r.item,r);add(byColor,r.color||"— not recorded —",r);});
  const cols=lbl=>[{label:lbl,key:"k"},{label:"Receipts",key:"n",align:"r",fmt:x=>nf(x.n)},
    {label:"Qty",key:"qty",align:"r",fmt:x=>nf(x.qty)},
    {label:"Kg",key:"kg",align:"r",fmt:x=>nf(x.kg,2)},{label:"Lbs",key:"lbs",align:"r",fmt:x=>nf(x.lbs,2)}];
  const tot={n:nf(rows.length),qty:nf(sum(rows,"qty")),kg:nf(sum(rows,"kg"),2),lbs:nf(sum(rows,"lbs"),2)};
  return reportHTML({
    title:titleOverride||"Purchase & Incoming Report",
    context:pFilterContext(f),
    kpis:[{k:"Receipts",v:nf(rows.length),u:"incoming lines"},
      {k:"Suppliers",v:nf(new Set(rows.map(r=>r.supplier)).size),u:"distinct"},
      {k:"Weight in",v:nf(sum(rows,"kg"),0),u:"kg"},{k:"Weight in",v:nf(sum(rows,"lbs"),0),u:"lbs"}],
    sections:[
      {heading:"Incoming by month (most recent 18)",cols:cols("Month"),
        rows:[...byMonth.values()].sort((a,b)=>a.k<b.k?1:-1).slice(0,18).map(x=>Object.assign({},x,{k:monthFull(x.k)})),totals:tot},
      {heading:"Top suppliers by weight",cols:cols("Supplier"),rows:[...bySup.values()].sort((a,b)=>b.kg-a.kg).slice(0,15)},
      {heading:"Top items by weight",cols:cols("Item"),rows:[...byItem.values()].sort((a,b)=>b.kg-a.kg).slice(0,15)},
      {heading:"By colour",cols:cols("Colour"),rows:[...byColor.values()].sort((a,b)=>b.kg-a.kg).slice(0,20),
        note:"Colour is split out of the recorded item name where it was written there; blank means it was never recorded."},
      {heading:"Receipt detail",note:rows.length>1200?"Showing the 1,200 most recent of "+nf(rows.length)+" receipts.":null,
        cols:[{label:"Date",key:"date",fmt:r=>fmtDate(r.date)},{label:"Supplier",key:"supplier"},
          {label:"Item",key:"item"},{label:"Colour",key:"color",fmt:r=>r.color||"—"},
          {label:"Lot",key:"lot",fmt:r=>r.lot||"—"},
          {label:"Qty",key:"qty",align:"r",fmt:r=>r.qty==null?"—":nf(r.qty)+" "+(r.unit||"")},
          {label:"Kg",key:"kg",align:"r",fmt:r=>nf(r.kg,2)},{label:"Lbs",key:"lbs",align:"r",fmt:r=>nf(r.lbs,2)},
          {label:"Ref",key:"ref",fmt:r=>r.ref||"—"}],
        rows:rows.slice(0,1200),
        totals:{kg:nf(sum(rows,"kg"),2),lbs:nf(sum(rows,"lbs"),2),qty:nf(sum(rows,"qty"))}}],
    footNote:"Purchase register — Yarn Dispatch Desk"});
}
