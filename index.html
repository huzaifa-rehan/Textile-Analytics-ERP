/* ---------- writes ---------- */
function learnPNames(rec){
  let touched=[];
  const push=(w,v)=>{if(!v)return;const l=REFS[w].get();if(!l.includes(v)){l.push(v);l.sort();touched.push(w);}};
  push("suppliers",rec.supplier);push("pitems",rec.item);push("colors",rec.color);
  touched.forEach(w=>enqueue(()=>saveRefs(w)));
}
async function addPurchase(rec){
  await ensureHistory();
  const key=rec.date.slice(0,7);
  if(!S.pmonths.has(key))S.pmonths.set(key,{month:key,rows:[]});
  S.pmonths.get(key).rows.push(Object.assign({id:uid("p"),src:"app"},rec));
  invalidate();learnPNames(rec);
  enqueue(()=>savePMonth(key));
  toast("Recorded · "+rec.supplier+" · "+nf(rec.kg,2)+" kg");
}
async function updatePurchase(id,rec){
  await ensureHistory();
  let oldKey=null;for(const[k,m]of S.pmonths)if(m.rows.some(r=>r.id===id))oldKey=k;
  if(!oldKey)return;
  const newKey=rec.date.slice(0,7),m=S.pmonths.get(oldKey),i=m.rows.findIndex(r=>r.id===id);
  const merged=Object.assign({},m.rows[i],rec);
  if(newKey===oldKey){m.rows[i]=merged;invalidate();learnPNames(rec);enqueue(()=>savePMonth(oldKey));}
  else{m.rows.splice(i,1);
    if(!S.pmonths.has(newKey))S.pmonths.set(newKey,{month:newKey,rows:[]});
    S.pmonths.get(newKey).rows.push(merged);invalidate();learnPNames(rec);
    enqueue(async()=>{await savePMonth(oldKey);await savePMonth(newKey);});}
  toast("Receipt updated");
}
async function removePurchase(r){
  const ok=await ask("Delete this receipt?",
    `${r.supplier} · ${r.item} · ${fmtDate(r.date)} · ${nf(pKg(r),2)} kg. This cannot be undone.`,"Delete",true);
  if(!ok)return;
  const key=r.date.slice(0,7),m=S.pmonths.get(key);if(!m)return;
  m.rows=m.rows.filter(x=>x.id!==r.id);invalidate();
  enqueue(()=>savePMonth(key));
  toast("Receipt deleted");closeDrawer();render();
}

/* ---------- purchase orders ---------- */
function pOrderMatches(o,r){
  if(r.supplier!==o.supplier||r.item!==o.item)return false;
  if(o.color&&(r.color||"")!==o.color)return false;
  const lot=(o.lot||"").trim().toLowerCase();
  if(lot&&!String(r.lot||"").toLowerCase().includes(lot))return false;
  if(o.dateOpened&&r.date<o.dateOpened)return false;
  if(o.closingDate&&r.date>o.closingDate)return false;
  return true;
}
function pOrderStats(o){
  const rows=allPRows().filter(r=>pOrderMatches(o,r));
  const qty=sum(rows,"qty"),kg=sum(rows,"kg"),lbs=sum(rows,"lbs");
  const cq=o.contractedQty||0,ck=o.contractedKg||0;
  const pct=ck>0?Math.min(100,kg/ck*100):(cq>0?Math.min(100,qty/cq*100):0);
  return{rows,qty,kg,lbs,openQty:cq-qty,openKg:ck-kg,pct,done:(ck>0&&kg>=ck)||(cq>0&&qty>=cq)};
}
function pOrderBadge(o,st){
  if(isClosed(o))return{cls:"b-closed",txt:"Closed",stripe:"stripe-off"};
  if(st.done)return{cls:"b-done",txt:"Received",stripe:"stripe-ok"};
  return{cls:"b-open",txt:"Open",stripe:"stripe"};
}
function exportPOrdersXlsx(){
  const cols=[{label:"Order",key:"id",type:"text",width:12},{label:"Supplier PO / Ref",key:"po",type:"text",width:18},
    {label:"Supplier",key:"supplier",type:"text",width:28},{label:"Item",key:"item",type:"text",width:28},
    {label:"Colour",key:"color",type:"text",width:14},{label:"Lot",key:"lot",type:"text",width:12},
    {label:"Opened",key:"dateOpened",type:"date",width:13},{label:"Status",key:"status",type:"text",width:11},
    {label:"Contracted Qty",key:"contractedQty",type:"dec",width:14},{label:"Unit",key:"unit",type:"text",width:8},
    {label:"Received Qty",key:"rQty",type:"dec",width:13},{label:"Open Qty",key:"oQty",type:"dec",width:11},
    {label:"Contracted Kg",key:"contractedKg",type:"dec",width:14},{label:"Received Kg",key:"rKg",type:"dec",width:13},
    {label:"Open Kg",key:"oKg",type:"dec",width:11},{label:"% Received",key:"pct",type:"int",width:12}];
  const rows=S.porders.map(o=>{const st=pOrderStats(o);
    return Object.assign({},o,{rQty:st.qty,oQty:Math.max(0,st.openQty),rKg:st.kg,oKg:Math.max(0,st.openKg),pct:Math.round(st.pct)});});
  download("yarn-purchase-orders.xlsx",buildXlsx({sheetName:"Purchase Orders",title:"Purchase Order Book",
    context:"As at "+fmtDate(todayISO()),cols,rows,
    totals:{contractedQty:sum(rows,"contractedQty"),rQty:sum(rows,"rQty"),oQty:sum(rows,"oQty"),
      contractedKg:sum(rows,"contractedKg"),rKg:sum(rows,"rKg"),oKg:sum(rows,"oKg")}}));
}
function viewPOrders(root,acts){
  const stats=S.porders.map(o=>({o,st:pOrderStats(o)}));
  const open=stats.filter(x=>!isClosed(x.o));
  head("Contracts","Purchase Orders",`${open.length} open · ${nf(open.reduce((s,x)=>s+Math.max(0,x.st.openKg),0),0)} kg still to arrive`);
  acts.append(
    el("button",{class:"btn",onclick:exportPOrdersXlsx},svgIcon("grid"),"Excel"),
    el("button",{class:"btn btn-primary",onclick:()=>editPOrder(null)},svgIcon("plus"),"New purchase order"));

  const cKg=open.reduce((s,x)=>s+(x.o.contractedKg||0),0),rKg=open.reduce((s,x)=>s+x.st.kg,0);
  const cQ=open.reduce((s,x)=>s+(x.o.contractedQty||0),0),rQ=open.reduce((s,x)=>s+x.st.qty,0);
  root.append(tileGroup("Open purchase orders","Everything not yet marked Closed",[
    tile("Orders open",nf(open.length),"contracts","accent"),
    tile("Contracted",nf(cQ),"units"),
    tile("Received",nf(rQ),"units"),
    tile("Still to arrive",nf(Math.max(0,cQ-rQ)),"units","accent")]));
  root.append(tileGroup("By weight",null,[
    tile("Contracted",nf(cKg,0),"kg"),
    tile("Received",nf(rKg,0),"kg"),
    tile("Still to arrive",nf(Math.max(0,cKg-rKg),0),"kg","accent"),
    tile("Received",cKg>0?Math.round(rKg/cKg*100)+"%":"—","of contracted kg","accent")]));

  if(!S.porders.length){
    root.append(el("div",{class:"card"},el("div",{class:"empty"},
      el("strong",null,"No purchase orders yet"),
      "Add one and every matching receipt is counted against it automatically — same rule as the sales side.")));
    return;
  }
  const showAll=S.pord.show==="all";
  const list=(showAll?stats:open).slice().sort((a,b)=>{
    const ac=isClosed(a.o),bc=isClosed(b.o);
    if(ac!==bc)return ac?1:-1;return b.st.openKg-a.st.openKg;});
  const tb=el("tbody");
  list.forEach(({o,st})=>{
    const b=pOrderBadge(o,st);
    tb.append(el("tr",{class:"clickable "+b.stripe,onclick:e=>{if(!e.target.closest("button"))openPOrder(o.id);}},
      el("td",{class:"mono"},o.id,o.po?el("span",{class:"hint",style:"display:block;font-size:10.5px"},"Ref "+o.po):null),
      el("td",null,o.supplier),
      el("td",null,o.item,o.color?el("span",{class:"chip col",style:"margin-left:6px"},o.color):null),
      el("td",null,o.lot?el("span",{class:"chip"},o.lot):el("span",{class:"hint"},"any")),
      el("td",null,fmtDate(o.dateOpened)),
      el("td",{class:"n"},nf(o.contractedQty)+" "+(o.unit||""),el("br"),el("span",{class:"hint num"},nf(o.contractedKg,0)+" kg")),
      el("td",{class:"n"},nf(st.qty),el("br"),el("span",{class:"hint num"},nf(st.kg,0)+" kg")),
      el("td",{class:"n"},nf(Math.max(0,st.openQty)),el("br"),el("span",{class:"hint num"},nf(Math.max(0,st.openKg),0)+" kg")),
      el("td",null,progress(st.pct)),el("td",null,el("span",{class:"badge "+b.cls},b.txt)),
      el("td",{style:"text-align:right"},el("button",{class:"btn btn-sm btn-ghost rowbtn",title:"Edit",onclick:()=>editPOrder(o)},svgIcon("edit")))));
  });
  root.append(el("div",{class:"card"},
    el("div",{class:"card-head"},el("h2",null,"Purchase order book"),
      el("span",{class:"hint"},"Click any order to see every receipt counted against it"),
      el("button",{class:"btn btn-sm",onclick:()=>{S.pord.show=showAll?"open":"all";render();}},showAll?"Show open only":"Show closed too")),
    el("div",{class:"tablewrap"},el("table",null,el("thead",null,el("tr",null,
      el("th",null,"Order"),el("th",null,"Supplier"),el("th",null,"Item"),el("th",null,"Lot"),el("th",null,"Opened"),
      el("th",{class:"n"},"Contracted"),el("th",{class:"n"},"Received"),el("th",{class:"n"},"Open"),
      el("th",null,"Progress"),el("th",null,"Status"),el("th",null,""))),tb))));
  root.append(el("div",{class:"notice"},
    "A receipt counts toward a purchase order when the supplier and item match, the colour matches (blank colour on the order = any colour), the lot matches (blank = any lot), and the date is on or after the order date."));
}
function openPOrder(id){
  const o=S.porders.find(x=>x.id===id);if(!o)return;
  const st=pOrderStats(o);
  openDrawer(o.id,o.supplier+"  ·  "+o.item+(o.color?"  ·  "+o.color:""),host=>{
    const kv=(k,v)=>el("div",null,el("span",{class:"k"},k),el("span",{class:"v"},v||"—"));
    host.append(el("div",{class:"kv"},
      kv("Supplier",o.supplier),kv("Item",o.item),kv("Colour",o.color),kv("Lot",o.lot||"any"),
      kv("Supplier ref / PO",o.po),kv("Opened",fmtDate(o.dateOpened)),
      kv("Closing date",o.closingDate?fmtDate(o.closingDate):"open-ended"),
      kv("Status",isClosed(o)?"Closed":st.done?"Received in full":"Open")));
    host.append(el("div",{class:"tiles t4"},
      tile("Contracted",nf(o.contractedQty)+" "+(o.unit||""),nf(o.contractedKg,0)+" kg"),
      tile("Received",nf(st.qty),nf(st.kg,0)+" kg","accent"),
      tile("Still to arrive",nf(Math.max(0,st.openQty)),nf(Math.max(0,st.openKg),0)+" kg"),
      tile("Progress",Math.round(st.pct)+"%","of contracted","brassy")));
    if(!st.rows.length){
      host.append(el("div",{class:"card"},el("div",{class:"empty"},
        el("strong",null,"Nothing received yet"),"Receipts matching this supplier and item will appear here.")));
      return;
    }
    const tb=el("tbody");
    st.rows.forEach(r=>tb.append(el("tr",{class:"clickable",onclick:()=>viewReceipt(r)},
      el("td",null,fmtDate(r.date)),el("td",{class:"mono"},r.ref||"—"),
      el("td",null,r.color?el("span",{class:"chip col"},r.color):"—"),
      el("td",null,r.lot?el("span",{class:"chip"},r.lot):"—"),
      el("td",{class:"n"},r.qty==null?"—":nf(r.qty)+" "+(r.unit||"")),
      el("td",{class:"n"},nf(pKg(r),2)),el("td",{class:"n"},nf(pLbs(r),2)))));
    host.append(el("div",{class:"card"},
      el("div",{class:"card-head"},el("h2",null,"Receipts against this order"),
        el("span",{class:"hint"},st.rows.length+" receipts")),
      el("div",{class:"tablewrap"},el("table",null,el("thead",null,el("tr",null,
        el("th",null,"Date"),el("th",null,"Ref"),el("th",null,"Colour"),el("th",null,"Lot"),
        el("th",{class:"n"},"Qty"),el("th",{class:"n"},"Kg"),el("th",{class:"n"},"Lbs"))),tb,
        el("tfoot",null,el("tr",null,el("th",{colspan:"4"},"TOTAL"),
          el("th",{class:"n"},nf(st.qty)),el("th",{class:"n"},nf(st.kg,2)),el("th",{class:"n"},nf(st.lbs,2))))))));
  },[el("button",{class:"btn",onclick:()=>editPOrder(o)},svgIcon("edit"),"Edit order")]);
}
function editPOrder(o){
  const isNew=!o,src=o||{};
  const F={};
  F.po=el("input",{value:src.po||"",placeholder:"supplier's ref — optional"});
  F.lot=el("input",{value:src.lot||"",placeholder:"blank = any lot"});
  F.opened=el("input",{type:"date",value:src.dateOpened||todayISO()});
  F.closing=el("input",{type:"date",value:src.closingDate||""});
  F.qty=el("input",{type:"number",step:"0.01",value:src.contractedQty==null?"":src.contractedQty,placeholder:"0"});
  F.unit=el("select",null,PUNITS.map(u=>el("option",{value:u,selected:u===(src.unit||"BAG")?true:null},u)));
  F.kg=el("input",{type:"number",step:"0.01",value:src.contractedKg==null?"":src.contractedKg,placeholder:"0.00"});
  F.status=el("select",null,["Open","Closed"].map(s=>el("option",{value:s,selected:s===(src.status||"Open")?true:null},s)));
  F.notes=el("textarea",{placeholder:"Terms, rate agreed, anything worth keeping"},src.notes||"");
  F.supC=combo({value:src.supplier||"",list:S.suppliers,placeholder:"Type a supplier…",allowFree:true,onChange:()=>{}});
  F.itemC=combo({value:src.item||"",list:S.pitems,placeholder:"Type an item…",allowFree:true,onChange:()=>{}});
  F.colC=combo({value:src.color||"",list:S.colors,placeholder:"blank = any colour",allowFree:true,onChange:()=>{}});
  const status=el("div",{class:"formerr",hidden:true});
  const save=async()=>{
    const rec={supplier:F.supC.getValue(),item:F.itemC.getValue(),color:F.colC.getValue(),
      lot:F.lot.value.trim(),po:F.po.value.trim(),dateOpened:F.opened.value,closingDate:F.closing.value,
      contractedQty:num(F.qty.value),unit:F.unit.value,contractedKg:num(F.kg.value),
      status:F.status.value,notes:F.notes.value.trim()};
    const fail=m=>{status.textContent=m;status.hidden=false;toast(m);};
    if(!rec.supplier)return fail("Enter the supplier.");
    if(!rec.item)return fail("Enter the item.");
    if(!rec.dateOpened)return fail("Enter the date this order was placed.");
    if(!rec.contractedQty&&!rec.contractedKg)return fail("Enter a contracted quantity or weight — otherwise there is nothing to track against.");
    status.hidden=true;
    let ord;
    if(isNew){
      const seq=S.meta.nextPOrderSeq||(S.porders.length+1);
      ord=Object.assign({id:"PO-"+String(seq).padStart(4,"0"),createdAt:todayISO()},rec);
      S.porders.push(ord);S.meta=Object.assign({},S.meta,{nextPOrderSeq:seq+1});
      enqueue(async()=>{await savePOrderDoc(ord);await saveMeta();});
      toast("Purchase order "+ord.id+" created");
    }else{ord=Object.assign(o,rec);enqueue(()=>savePOrderDoc(ord));toast(ord.id+" updated");}
    learnPNames(rec);closeDrawer();render();
  };
  openDrawer(isNew?"New purchase order":"Edit "+src.id,isNew?"Contract stock in from a supplier":src.supplier,host=>{
    host.append(el("div",{class:"card"},el("div",{class:"card-body",style:"display:flex;flex-direction:column;gap:15px"},
      el("div",{class:"formgrid"},
        el("label",{class:"field req",style:"grid-column:span 2"},"Supplier",el("span",{class:"rq"},"*"),F.supC),
        el("label",{class:"field"},"Supplier ref / PO no.",F.po),
        el("label",{class:"field req",style:"grid-column:span 2"},"Item / yarn spec",el("span",{class:"rq"},"*"),F.itemC),
        el("label",{class:"field"},"Colour",F.colC),
        el("label",{class:"field"},"Lot",F.lot),
        el("label",{class:"field req"},"Date placed",el("span",{class:"rq"},"*"),F.opened),
        el("label",{class:"field"},"Closing date",F.closing),
        el("label",{class:"field"},"Contracted qty",F.qty),
        el("label",{class:"field"},"Unit",F.unit),
        el("label",{class:"field"},"Contracted kg",F.kg),
        el("label",{class:"field"},"Status",F.status),
        el("label",{class:"field",style:"grid-column:1/-1"},"Notes",F.notes)),
      el("div",{class:"hint"},"Leave colour or lot blank and the order counts every colour or lot of that item from that supplier."),
      status)));
    if(!isNew)host.append(el("div",{class:"card"},el("div",{class:"card-body"},
      el("button",{class:"btn btn-danger",onclick:async()=>{
        if(!await ask("Delete this purchase order?",
          `${src.id} · ${src.supplier} · ${src.item}. Receipts already recorded are not touched.`,"Delete",true))return;
        S.porders=S.porders.filter(x=>x.id!==src.id);
        await enqueue(()=>S.db.doc("porders/"+src.id).delete());
        toast("Purchase order deleted");closeDrawer();render();}},svgIcon("trash"),"Delete this order"))));
  },[el("button",{class:"btn btn-primary",onclick:save},isNew?"Create order":"Save changes")]);
}

/* ============ drawer ============ */
function openDrawer(title,sub,build,actions){
  closeDrawer();
  const body=el("div",{class:"drawer-body"});
  const dr=el("div",{class:"drawer",role:"dialog","aria-modal":"true","aria-label":title},
    el("div",{class:"drawer-head"},
      el("div",{style:"min-width:0"},el("h2",null,title),el("div",{class:"hint",style:"margin-top:3px"},sub||"")),
      el("div",{style:"margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center"},
        actions||[],el("button",{class:"btn btn-ghost",onclick:closeDrawer,title:"Close (Esc)"},svgIcon("x")))),
    body);
  build(body);
  $("#drawerHost").append(el("div",{class:"scrim",onclick:closeDrawer}),dr);
  document.body.style.overflow="hidden";
  document.addEventListener("keydown",escClose);
  const first=dr.querySelector("input,select,button");if(first)first.focus();
}
function escClose(e){if(e.key==="Escape")closeDrawer();}
function closeDrawer(){
  $("#drawerHost").textContent="";
  document.body.style.overflow="";
  document.removeEventListener("keydown",escClose);
}

/* ============ boot ============ */
/* Nothing in this app is allowed to fail silently — a clerk mid-challan must
   always see why a button did nothing. */
window.addEventListener("error",e=>{
  console.error(e.error||e.message);
  setSave("error","Something went wrong");
  toast("Error: "+(e.message||"see console"));
});
window.addEventListener("unhandledrejection",e=>{
  const r=e.reason;console.error(r);
  setSave("error","Something went wrong");
  toast("Error: "+((r&&(r.message||r.code))||r));
});
initTheme();
$("#themeBtn").addEventListener("click",toggleTheme);
(async function boot(){
  render();
  let db=null,dl=null;
  try{db=(window.claude&&claude.use)?await claude.use("db"):null;}catch(e){db=null;}
  try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null;}catch(e){dl=null;}
  S.db=db;S.downloads=dl;
  if(!db){S.loadError="no-db";setSave("error","Storage unavailable");render();return;}
  try{
    await loadCore();
    S.ready=true;setSave("idle","All changes saved");
    $("#dbInfo").textContent="Loading history…";
    render();
    S.histPromise=loadHistory().then(()=>{
      $("#dbInfo").textContent=nf(allRows().length)+" deliveries · "+nf(allPRows().length)+" receipts";
      render();
    }).catch(e=>{console.error(e);setSave("error","History failed to load");});
  }catch(e){console.error(e);S.loadError=String((e&&e.message)||e);setSave("error","Could not load");render();}
})();
</script>
